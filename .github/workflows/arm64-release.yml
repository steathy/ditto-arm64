name: Windows ARM64 build and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
    paths-ignore: ['updates/arm64.json']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build and test native ARM64
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release tag
        id: metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          $metadata = & ./tools/arm64/Get-ReleaseMetadata.ps1 -Tag $env:RELEASE_TAG
          "version=$($metadata.version)" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG) {
            git merge-base --is-ancestor HEAD "origin/$($metadata.releaseBranch)"
            if ($LASTEXITCODE) { throw 'Release tag must point to a commit on its declared release branch.' }
          }
      - name: Audit tracked source
        run: ./tools/arm64/Test-SourceHygiene.ps1
      - name: Test release publication safeguards offline
        run: ./tools/arm64/Test-ReleasePublication.ps1
      - name: Install verified Inno Setup 6.7.4
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          $expected = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          if ((Get-FileHash $setup).Hash -ne $expected) { throw 'Inno Setup SHA-256 mismatch.' }
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') {
            throw 'Inno Setup publisher verification failed.'
          }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'work/tools/InnoSetup6'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="{0}"' -f $destination)) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          if (!(Test-Path "$destination/ISCC.exe")) { throw 'Inno Setup compiler is missing.' }
      - name: Build Release ARM64
        run: ./tools/arm64/Build-Arm64.ps1 -Configuration Release
      - name: Run native updater checks
        run: ./tools/arm64/Test-Updater.ps1
      - name: Package portable build
        run: ./tools/arm64/Package-Portable.ps1 -OutputDirectory artifacts/portable
      - name: Test isolated startup, database and ICU
        run: ./tools/arm64/Test-Portable.ps1 -PackagePath artifacts/portable
      - name: Build installer
        run: ./tools/arm64/Build-Installer.ps1 -PackagePath artifacts/portable -OutputDirectory artifacts/installer
      - name: Prepare release assets and checksums
        run: ./tools/arm64/New-ReleaseAssets.ps1 -PackagePath artifacts/portable -InstallerPath artifacts/installer
      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ditto-arm64-${{ steps.metadata.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arm64-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/*.log
            work/source-hygiene.json
            work/update-test-*/*.log
            work/portable-test-*/*.log
            work/portable-test-*/smoke-results.json
            artifacts/installer/compile.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish versioned release and update feed
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'steathy/ditto-arm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: arm64-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ditto-arm64-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish verified assets, then update the selected channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/arm64/Publish-GitHubRelease.ps1 -AssetPath artifacts/release -Tag $env:GITHUB_REF_NAME
